spring.config.import=optional:file:.env.properties

spring.application.name=S6-ZMP-System-indentyfikacji-flory-API

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.web.error.include-stacktrace=${SPRING_WEB_ERROR_INCLUDE_STACKTRACE:never}
spring.jackson.deserialization.fail-on-unknown-properties=${SPRING_JACKSON_DESERIALIZATION_FAIL_ON_UNKNOWN_PROPERTIES:true}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:3000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITETIMEOUT:5000}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

server.port=${PORT:8080}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.photo-storage-path=${PHOTO_STORAGE_PATH:./photos}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:11MB}

app.rate-limit.capacity=${APP_RATE_LIMIT_CAPACITY:30}
app.rate-limit.refill-minutes=${APP_RATE_LIMIT_REFILL_MINUTES:1}

plantnet.api-key=${PLANTNET_API_KEY}

logging.level.org.hibernate.tool.schema=${LOGGING_LEVEL_ORG_HIBERNATE_TOOL_SCHEMA:INFO}

spring.config.import=optional:file:.env.properties

spring.application.name=S6-ZMP-System-indentyfikacji-flory-API

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false

spring.web.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

jwt.expiration-ms=604800000

server.port=${PORT:8080}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.photo-storage-path=${PHOTO_STORAGE_PATH:./photos}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.rate-limit.capacity=30
app.rate-limit.refill-minutes=1

plantnet.api-key=${PLANTNET_API_KEY}

spring.jpa.hibernate.ddl-auto=update

openapi: 3.1.0
info:
  title: Virtual Plant Collection API
  version: 1.0.0
  summary: REST API for mobile, web, and desktop apps in the virtual plant collection system.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: users
    description: Registration, login, profile, password reset, and user views.
  - name: collections
    description: User plant collections.
  - name: plants
    description: Plants and plant photos inside collections.
  - name: friends
    description: Friends and friend requests.
  - name: social
    description: Public gallery, rankings, and compare views.
  - name: notifications
    description: User notifications and push token registration.
  - name: admin
    description: Admin tools.

security:
  - bearerAuth: []

paths:
  /users/register:
    post:
      tags: [users]
      summary: Register a new user
      operationId: register
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              basic:
                value:
                  username: jan_kowalski
                  email: jan@example.com
                  password: StrongPassw0rd!
      responses:
        '200':
          description: User registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Username or email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/login:
    post:
      tags: [users]
      summary: Login and get JWT
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: User is blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/refresh:
    post:
      tags: [users]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New tokens returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/logout:
    post:
      tags: [users]
      summary: Logout user
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/password/forgot:
    post:
      tags: [users]
      summary: Start password reset
      operationId: forgotPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /users/password/reset:
    post:
      tags: [users]
      summary: Reset password
      operationId: resetPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: Reset token expired or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/me:
    get:
      tags: [users]
      summary: Get current user
      operationId: me
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Current user data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      summary: Update current user
      operationId: updateMe
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/search:
    get:
      tags: [users]
      summary: Search users
      operationId: searchUsers
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: query
          in: query
          required: true
          description: Username or part of username.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Users found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/ranking:
    get:
      tags: [social]
      summary: Get user ranking
      operationId: getUserRanking
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: sortBy
          in: query
          description: Ranking mode.
          schema:
            type: string
            enum: [uniqueSpecies, totalPlants, totalCollections]
            default: uniqueSpecies
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Ranking data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRankingResponse'

  /users/{userId}:
    get:
      tags: [users]
      summary: Get user public profile
      operationId: getUserById
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User public profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/collections:
    get:
      tags: [collections]
      summary: Get collections of a user
      operationId: getUserCollections
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/UserId'
        - name: visibility
          in: query
          description: Filter by visibility.
          schema:
            $ref: '#/components/schemas/CollectionVisibility'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Visible collections of the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/compare:
    get:
      tags: [social]
      summary: Compare your plants with another user
      operationId: compareUsers
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Compare result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompareResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/push-tokens:
    post:
      tags: [notifications]
      summary: Save mobile push token
      operationId: savePushToken
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRequest'
      responses:
        '200':
          description: Token saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [notifications]
      summary: Delete mobile push token
      operationId: deletePushToken
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /collections:
    get:
      tags: [collections]
      summary: Get my collections
      operationId: getMyCollections
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: visibility
          in: query
          schema:
            $ref: '#/components/schemas/CollectionVisibility'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Current user's collections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [collections]
      summary: Create collection
      operationId: createCollection
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /collections/public:
    get:
      tags: [social]
      summary: Get public collections
      operationId: getPublicCollections
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: ownerUsername
          in: query
          schema:
            type: string
        - name: query
          in: query
          description: Search by collection name or short description.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Public collections list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'

  /collections/{collectionId}:
    get:
      tags: [collections]
      summary: Get collection by id
      operationId: getCollectionById
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Collection details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [collections]
      summary: Update collection
      operationId: updateCollection
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionRequest'
      responses:
        '200':
          description: Collection updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [collections]
      summary: Delete collection
      operationId: deleteCollection
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '204':
          description: Collection deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /collections/{collectionId}/plants:
    get:
      tags: [plants]
      summary: Get plants in collection
      operationId: getCollectionPlants
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CollectionId'
        - name: query
          in: query
          description: Search by scientific name, common name, family, or note.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Plants in the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [plants]
      summary: Add plant to collection
      operationId: createPlant
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CollectionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePlantForm'
      responses:
        '201':
          description: Plant added to collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /plants/identify/{project}:
    post:
      tags: [plants]
      summary: Identify plant from photos
      description: |
        This endpoint uses the external PlantNet identification API.
        The backend sends the photos to PlantNet and returns the result in a normalized format.
        Client apps do not send the provider API key directly to this endpoint.

        One request should describe one plant.
        Supported files: image/jpeg, image/png.
        Max total request size: 52428800 bytes.
        Max images: 5.
      operationId: identifyPlant
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: project
          in: path
          required: true
          description: PlantNet project. Use all or a project name.
          schema:
            type: string
            default: all
        - name: include-related-images
          in: query
          description: If true, each result may include similar images.
          schema:
            type: boolean
            default: false
        - name: no-reject
          in: query
          description: If true, disable no-result reject class.
          schema:
            type: boolean
            default: false
        - name: nb-results
          in: query
          description: Max number of results.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
        - name: lang
          in: query
          description: Language for result labels.
          schema:
            type: string
            enum:
              [en, fr, es, pt, de, it, ar, cs, nl, sk, zh, ru, tr, pl, uk, he, el, fi, id, ms, ca, ja, hu, hr, da, ro, bg, nb, sl, sv, et, eu, ur, ml, cy, ku, gl, eo, sat, zh-tw, pt-br, hi, de-at, sr, zh-hant, bn, fa, be, oc, lt, en-au, br]
            default: en
        - name: type
          in: query
          description: Recognition model type.
          schema:
            type: string
            enum: [kt, legacy]
            default: kt
        - name: detailed
          in: query
          description: If true, add genus and family results too.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlantIdentifyRequest'
      responses:
        '200':
          description: Plant identification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantIdentifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Species not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          description: URI too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /plants/{plantId}:
    get:
      tags: [plants]
      summary: Get plant by id
      operationId: getPlantById
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PlantId'
      responses:
        '200':
          description: Plant details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [plants]
      summary: Update plant
      operationId: updatePlant
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PlantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlantRequest'
      responses:
        '200':
          description: Plant updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [plants]
      summary: Delete plant
      operationId: deletePlant
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PlantId'
      responses:
        '204':
          description: Plant deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /plants/{plantId}/photos:
    post:
      tags: [plants]
      summary: Add photos to plant
      operationId: addPlantPhotos
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PlantId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddPlantPhotosRequest'
      responses:
        '200':
          description: Photos added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /plants/{plantId}/photos/{photoId}:
    delete:
      tags: [plants]
      summary: Delete one photo from plant
      operationId: deletePlantPhoto
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PlantId'
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '204':
          description: Photo deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /friends:
    get:
      tags: [friends]
      summary: Get my friends
      operationId: getMyFriends
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Friend list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friends/requests:
    get:
      tags: [friends]
      summary: Get my friend requests
      operationId: getFriendRequests
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/FriendRequestStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Friend requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [friends]
      summary: Send friend request
      operationId: sendFriendRequest
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFriendRequest'
      responses:
        '201':
          description: Friend request sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Request already exists or users are already friends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /friends/requests/{requestId}/accept:
    post:
      tags: [friends]
      summary: Accept friend request
      operationId: acceptFriendRequest
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Friend request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request cannot be accepted in current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /friends/requests/{requestId}/decline:
    post:
      tags: [friends]
      summary: Decline friend request
      operationId: declineFriendRequest
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Friend request declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request cannot be declined in current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /friends/{friendUserId}:
    delete:
      tags: [friends]
      summary: Remove friend
      operationId: removeFriend
      parameters:

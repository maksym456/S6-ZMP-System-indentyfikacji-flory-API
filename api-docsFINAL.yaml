components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred language for messages.
      schema:
        type: string
        enum: [pl-PL, en-US]
        default: pl-PL
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlantId:
      name: plantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: No permission for this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Uploaded files are too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: Unsupported file type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        path:
          type: string
          example: /users/register
        details:
          type: array
          items:
            type: string

    PageInfo:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 125
        totalPages:
          type: integer
          example: 7

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Operation completed

    UserRole:
      type: string
      enum: [USER, ADMIN]

    CollectionVisibility:
      type: string
      enum: [PRIVATE, FRIENDS, PUBLIC]

    PlantSource:
      type: string
      enum: [MANUAL, IDENTIFY]

    FriendRequestStatus:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED, CANCELED]

    NotificationType:
      type: string
      enum: [WARNING, FRIEND_REQUEST, FRIEND_ACCEPTED, SYSTEM, PUSH]

    OrganType:
      type: string
      enum: [auto, leaf, flower, fruit, bark, habit, scan, branch, sheet, other, drawing, seed, bud, anatomy, aerial]

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password

    RegisterResponse:
      type: object
      required: [id, username, email]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Username or email.
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [id, username, email, token]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        token:
          type: string
          description: JWT access token.
        refreshToken:
          type: string
          description: JWT refresh token.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token to revoke. Optional if session is tracked from access token.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          format: password

    UserResponse:
      type: object
      required: [id, username, email, role, blocked, createdAt, stats]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        blocked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        preferredLanguage:
          type: string
          enum: [pl, en]
        bio:
          type: string
        stats:
          $ref: '#/components/schemas/UserStats'

    UserStats:
      type: object
      required: [totalCollections, totalPlants, uniqueSpecies, friendsCount]
      properties:
        totalCollections:
          type: integer
        totalPlants:
          type: integer
        uniqueSpecies:
          type: integer
        friendsCount:
          type: integer
        publicCollections:
          type: integer

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        bio:
          type: string
          maxLength: 1000
        preferredLanguage:
          type: string
          enum: [pl, en]

    PublicUserResponse:
      type: object
      required: [id, username, createdAt, stats]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        bio:
          type: string
        createdAt:
          type: string
          format: date-time
        stats:
          $ref: '#/components/schemas/PublicUserStats'

    PublicUserStats:
      type: object
      required: [publicCollections, totalPublicPlants, uniquePublicSpecies]
      properties:
        publicCollections:
          type: integer
        totalPublicPlants:
          type: integer
        uniquePublicSpecies:
          type: integer

    UserShort:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        avatarUrl:
          type: string
          format: uri

    UserSearchResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserShort'
        page:
          $ref: '#/components/schemas/PageInfo'

    CollectionSummary:
      type: object
      required: [id, name, visibility, plantsCount, uniqueSpeciesCount, owner]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'
        plantsCount:
          type: integer
        uniqueSpeciesCount:
          type: integer
        coverPhotoUrl:
          type: string
          format: uri
        owner:
          $ref: '#/components/schemas/UserShort'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CollectionResponse:
      type: object
      required: [id, name, visibility, owner, plantsCount, uniqueSpeciesCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'
        owner:
          $ref: '#/components/schemas/UserShort'
        plantsCount:
          type: integer
        uniqueSpeciesCount:
          type: integer
        coverPhotoUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CollectionListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    CreateCollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'

    UpdateCollectionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        visibility:
          $ref: '#/components/schemas/CollectionVisibility'

    PlantPhotoResponse:
      type: object
      required: [id, url, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        organ:
          $ref: '#/components/schemas/OrganType'
        uploadedAt:
          type: string
          format: date-time

    PlantLocation:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    PlantResponse:
      type: object
      required:
        [id, collectionId, scientificName, source, photos, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid
        scientificName:
          type: string
        scientificNameAuthor:
          type: string
        commonName:
          type: string
        family:
          type: string
        genus:
          type: string
        description:
          type: string
        source:
          $ref: '#/components/schemas/PlantSource'
        recognitionScore:
          type: number
          format: double
        gbifId:
          type: integer
          format: int64
        powoId:
          type: string
        iucnId:
          type: string
        iucnCategory:
          type: string
        capturedAt:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/PlantLocation'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PlantPhotoResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        owner:
          $ref: '#/components/schemas/UserShort'

    PlantSummary:
      allOf:
        - $ref: '#/components/schemas/PlantResponse'

    PlantListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlantSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    CreatePlantForm:
      type: object
      required: [scientificName, source, images]
      properties:
        scientificName:
          type: string
          description: Scientific name selected by user. Usually taken from identify result.
        scientificNameAuthor:
          type: string
        commonName:
          type: string
        family:
          type: string
        genus:
          type: string
        description:
          type: string
          maxLength: 5000
        source:
          $ref: '#/components/schemas/PlantSource'
        recognitionScore:
          type: number
          format: double
        gbifId:
          type: integer
          format: int64
        powoId:
          type: string
        iucnId:
          type: string
        iucnCategory:
          type: string
        capturedAt:
          type: string
          format: date-time
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        images:
          type: array
          maxItems: 5
          items:
            type: string
            format: binary
        organs:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/OrganType'

    UpdatePlantRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 5000
        commonName:
          type: string
        capturedAt:
          type: string
          format: date-time
        latitude:
          type: number
          format: double
